<div class="modal-backdrop" (click)="closed.emit()"></div>

<div class="modal-panel" [ngClass]="'modal-panel--' + size" role="dialog" [attr.aria-label]="title">
  <div class="modal-panel__header">
    <h2 class="modal-panel__title">{{ title }}</h2>
    <button class="modal-panel__close" (click)="closed.emit()" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <div class="modal-panel__body">
    <ng-content />
  </div>

  <ng-content select="[modal-footer]" />
</div>
