<div class="dash-card" [class.dash-card--alert]="critical() > 0">
  <div class="dash-card__header">
    <div class="dash-card__icon dash-card__icon--red">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>
    <span class="dash-card__label">Riesgos</span>
    <a routerLink="/risks" class="dash-card__link">Ver todos →</a>
  </div>

  @if (loading()) {
    <div class="dash-card__skeleton"></div>
  } @else {
    <div class="dash-card__value">{{ total() }}</div>
    <div class="dash-card__stats">
      <span class="dash-card__stat dash-card__stat--warn">
        <span class="dash-card__dot"></span>{{ open() }} abiertos
      </span>
      <span class="dash-card__stat dash-card__stat--crit">
        <span class="dash-card__dot"></span>{{ critical() }} críticos
      </span>
    </div>
  }
</div>
