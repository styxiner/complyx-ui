<div class="dash-card">
  <div class="dash-card__header">
    <div class="dash-card__icon dash-card__icon--green">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
      </svg>
    </div>
    <span class="dash-card__label">Políticas</span>
    <a routerLink="/policies" class="dash-card__link">Ver todas →</a>
  </div>

  @if (loading()) {
    <div class="dash-card__skeleton"></div>
  } @else {
    <div class="dash-card__value">{{ total() }}</div>
    <div class="dash-card__stats">
      <span class="dash-card__stat dash-card__stat--pass">
        <span class="dash-card__dot"></span>{{ active() }} activas
      </span>
      <span class="dash-card__stat dash-card__stat--warn">
        <span class="dash-card__dot"></span>{{ draft() }} borrador
      </span>
    </div>
  }
</div>
