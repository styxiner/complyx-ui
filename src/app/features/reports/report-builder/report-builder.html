<div class="rb">

  <!-- Panel configuración (oculto al imprimir) -->
  <aside class="rb__sidebar no-print">

    <div class="rb__section">
      <h2 class="rb__section-title">Tipo de reporte</h2>
      <div class="rb__type-btns">
        <button class="rb__type-btn" [class.rb__type-btn--active]="reportType() === 'system'"
                (click)="setType('system')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125z"/>
          </svg>
          General del sistema
        </button>
        <button class="rb__type-btn" [class.rb__type-btn--active]="reportType() === 'risks'"
                (click)="setType('risks')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
          </svg>
          Riesgos activos
        </button>
      </div>
    </div>

    <!-- Filtros solo visibles en modo riesgos -->
    @if (reportType() === 'risks') {
      <div class="rb__section">
        <h2 class="rb__section-title">Filtros</h2>

        <div class="rb__field">
          <label class="rb__label">Estado</label>
          <select class="rb__select" [(ngModel)]="filterStatus">
            <option value="">Todos</option>
            @for (s of STATUS_OPTIONS; track s) {
              <option [value]="s">{{ s }}</option>
            }
          </select>
        </div>

        <div class="rb__field">
          <label class="rb__label">Nivel de riesgo</label>
          <select class="rb__select" [(ngModel)]="filterLevel">
            <option value="">Todos</option>
            @for (l of LEVEL_OPTIONS; track l) {
              <option [value]="l">{{ l }}</option>
            }
          </select>
        </div>
      </div>
    }

    <div class="rb__actions">
      <button class="rb__btn rb__btn--primary" (click)="generate()" [disabled]="loading()">
        @if (loading()) {
          <span class="rb__spinner"></span> Generando…
        } @else {
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5z" clip-rule="evenodd"/>
          </svg>
          Generar reporte
        }
      </button>

      @if (generated()) {
        <button class="rb__btn rb__btn--ghost" (click)="print()">
          <svg viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2h1a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-1V4a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1zm2 0h6v3H7V4zm-1 9v-1h8v1H6zm-2-4a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm13 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" clip-rule="evenodd"/>
          </svg>
          Exportar PDF
        </button>
      }
    </div>

  </aside>

  <!-- Vista previa -->
  <main class="rb__preview">
    @if (!generated() && !loading()) {
      <div class="rb__empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9z"/>
        </svg>
        <p>Configura y genera un reporte para previsualizarlo aquí</p>
      </div>
    }

    @if (loading()) {
      <div class="rb__empty">
        <div class="rb__spinner rb__spinner--lg"></div>
        <p>Cargando datos…</p>
      </div>
    }

    @if (generated()) {
      <app-report-preview-panel
        [type]="reportType()"
        [systemData]="systemData()"
        [risksData]="risksData()">
      </app-report-preview-panel>
    }
  </main>

</div>
